name: Auto-Deploy API + PWA + Backoffice

# Bei jedem Push auf main laeuft ZUERST der Job `check` (Build aller
# Pakete + API-Tests). Nur wenn er gruen ist, werden die drei fly-Apps
# redeployed:
#   hotdoc-api          (Node-Backend)
#   hotdoc-eberstalzell (PWA fuer Tablets, Caddy + dist/)
#   hotdoc-backoffice   (React-Admin, Caddy + dist/)
#
# Die APK ist EXPLIZIT NICHT enthalten — das ist ein separater
# Release-Workflow der nur bei Tags v*.*.* triggert (siehe
# release-apk.yml). Hintergrund: APK-Build dauert 3-4 min und
# braucht einen Signing-Keystore — sollte nur bei expliziten
# Releases laufen, nicht bei jedem Commit.
#
# Per workflow_dispatch kann man auch manuell jeden Service
# einzeln deployen ohne Push.

on:
  push:
    branches: [main]
    paths-ignore:
      # Aenderungen die kein Backend-Code sind -> kein Deploy
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'deploy/apk/**'
  workflow_dispatch:
    inputs:
      services:
        description: 'Welche Services deployen? (api, pwa, backoffice, all)'
        required: false
        default: 'all'
        type: choice
        options: [all, api, pwa, backoffice]

jobs:
  # ───────────────────────────────────────────────────────────────
  # Check — Build + Tests als Sperre vor jedem Deploy.
  # Laeuft IMMER (auch bei workflow_dispatch fuer nur einen Service),
  # damit `needs: check` die Deploy-Jobs nie versehentlich ueberspringt.
  # Versionen passen zu den Dockerfiles (node:20.18, pnpm 9.15.9).
  # Die API-Tests laufen ohne CouchDB (couch/client wird gemockt).
  # ───────────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Wie in den Dockerfiles: kein Chromium-Download fuer puppeteer
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: pnpm installieren
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: '20.18'
          cache: pnpm

      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile

      - name: Shared bauen
        run: pnpm --filter @hotdoc/shared build

      - name: API bauen
        run: pnpm --filter @hotdoc/api build

      - name: PWA bauen
        run: pnpm --filter @hotdoc/pwa build

      - name: Backoffice bauen
        run: pnpm --filter @hotdoc/backoffice build

      - name: API-Tests
        run: pnpm --filter @hotdoc/api test

  # ───────────────────────────────────────────────────────────────
  # API — Node-Backend, dependency-armer Build, schnellster Deploy
  # ───────────────────────────────────────────────────────────────
  deploy-api:
    needs: check
    if: ${{ github.event_name == 'push' || inputs.services == 'all' || inputs.services == 'api' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy hotdoc-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.api.toml --remote-only --strategy immediate

  # ───────────────────────────────────────────────────────────────
  # PWA — Vite-Build im Container, Caddy serves statische dist/
  # ───────────────────────────────────────────────────────────────
  deploy-pwa:
    needs: check
    if: ${{ github.event_name == 'push' || inputs.services == 'all' || inputs.services == 'pwa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy hotdoc-eberstalzell (PWA)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.pwa.toml --remote-only --strategy immediate

  # ───────────────────────────────────────────────────────────────
  # Backoffice — gleicher Build-Pattern wie PWA
  # ───────────────────────────────────────────────────────────────
  deploy-backoffice:
    needs: check
    if: ${{ github.event_name == 'push' || inputs.services == 'all' || inputs.services == 'backoffice' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy hotdoc-backoffice
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.backoffice.toml --remote-only --strategy immediate

  # ───────────────────────────────────────────────────────────────
  # Zusammenfassung — laeuft immer am Schluss, auch wenn Teile failen
  # ───────────────────────────────────────────────────────────────
  summary:
    needs: [check, deploy-api, deploy-pwa, deploy-backoffice]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Status-Report
        run: |
          {
            echo "## Auto-Deploy Zusammenfassung"
            echo ""
            echo "| Service | Status |"
            echo "|---|---|"
            echo "| check (Build + Tests) | ${{ needs.check.result }} |"
            echo "| hotdoc-api          | ${{ needs.deploy-api.result }} |"
            echo "| hotdoc-eberstalzell | ${{ needs.deploy-pwa.result }} |"
            echo "| hotdoc-backoffice   | ${{ needs.deploy-backoffice.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
